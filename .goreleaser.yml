version: 2
project_name: gh-timeline
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/gh-timeline
    binary: gh-timeline
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      # {{ .Version }} は先頭の v を落とすため、go install で入れたときの表記（v0.4.1）と揃うタグ名を使う。
      - -s -w -X main.version={{ .Tag }}
archives:
  # gh extension install は Release から "gh-timeline-<os>-<arch>" で終わる名前のファイルを探し、
  # そのまま実行ファイルとして置く。アーカイブに固めると見つけられないため、バイナリのまま載せる。
  - formats: [binary]
    name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'
# Release とその本文は release-please が下書きで先に作るため、GoReleaser はバイナリを載せて公開するだけにする。
changelog:
  disable: true
release:
  prerelease: auto
  mode: keep-existing
  # GitHub の tag で Release を引く API は下書きを返さないため、下書きは名前で探させる。
  # release-please は Release 名をタグと同じ "vX.Y.Z" にするので、名前もタグにそろえる。
  use_existing_draft: true
  name_template: "{{ .Tag }}"
  # 途中で失敗したジョブを再実行すると、載せ終えたバイナリと重なって 422 で止まるため。
  replace_existing_artifacts: true
