version: 2
project_name: gh-timeline
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/gh-timeline
    binary: gh-timeline
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  # gh extension install は Release から "gh-timeline-<os>-<arch>" で終わる名前のファイルを探し、
  # そのまま実行ファイルとして置く。アーカイブに固めると見つけられないため、バイナリのまま載せる。
  - formats: [binary]
    name_template: '{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}'
# Release とその本文は release-please が先に作るため、GoReleaser はバイナリを載せるだけにする。
changelog:
  disable: true
release:
  prerelease: auto
  mode: keep-existing
